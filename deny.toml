[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-only",
]

# libFuzzer's own sources, which the targets under fuzz/ build: the University
# of Illinois/NCSA licence, permissive and compatible with this one. Allowed
# for that crate alone; nothing the tool ships depends on it.
[[licenses.exceptions]]
allow = ["NCSA"]
crate = "libfuzzer-sys"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# path dependencies inside the workspace carry no version; cargo-deny calls them wildcards
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
