[package]
name = "oadec-cli"
description = "oadec command-line tool: inspect, verify and decode TrueHD Atmos and E-AC-3 JOC streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "oadec"
path = "src/main.rs"

[dependencies]
oadec-engine.workspace = true
oadec-bits.workspace = true
oadec-diag.workspace = true
oadec-emdf.workspace = true
oadec-truehd.workspace = true
oadec-eac3.workspace = true
oadec-spatial.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

# The streams the command-line tests write for themselves, and the taps a
# test of the JOC options writes to a file.
[dev-dependencies]
oadec-joc.workspace = true
oadec-synth.workspace = true

[lints]
workspace = true
