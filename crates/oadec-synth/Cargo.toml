[package]
name = "oadec-synth"
description = "TrueHD, MLP and AC-3 streams written from a recipe, to give the decoder syntax no real material carries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The writer does not depend on the decoder it is there to test: the syntax
# and the arithmetic are written here a second time, from docs/truehd.md and,
# for AC-3, from ETSI TS 102 366. Only the CRC and parity primitives are
# shared. The decoders are dependencies of the tests alone.
[dependencies]
oadec-bits.workspace = true

[dev-dependencies]
oadec-eac3.workspace = true
oadec-truehd.workspace = true

[lints]
workspace = true
