name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release -p oadec-cli --locked

  # The media suite decodes the real corpus and cannot run here: the streams are
  # films and are not in the repository. What can run here is the check that it
  # says so. It used to print "10 passed" in 0.00 s with OADEC_MEDIA unset,
  # because every test returned Ok after printing "skipping" -- a green
  # conformance result that proved nothing. This job fails if that ever comes
  # back. Conformance itself is run by hand against the work directory and its
  # results are stored under docs/audit/evidence/.
  media-suite-refuses-to-pass-without-media:
    name: the media suite reports not-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the conformance suite must fail without OADEC_MEDIA, not pass
        run: |
          if cargo test --release -p oadec-cli --test real -- --ignored; then
            echo "::error::the media suite reported success with no media present"
            exit 1
          fi
          echo "the media suite refused to run without media, as it should"

  # The ADM audit toolkit (docs/audit/adm/tools) reads DAMF and ADM without
  # the writers' help and is the measure the 2026-09-11 audit judged them with.
  # The remediation kept it as the gate: every writer-level case runs through
  # the harness crate and has an expectation in run_remediation.py. The Dolby
  # tools and the EBU renderer are not on a runner; those stages are run by
  # hand and their results live under docs/audit/evidence/adm-remediation/.
  adm-toolkit:
    name: ADM toolkit (harness cases and expectations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy==1.26.4"
      - name: toolkit self-tests
        working-directory: docs/audit/adm/tools
        run: python -m unittest discover -s selftest -t .
      - name: build the writer harness
        run: cargo build --release --locked --manifest-path docs/audit/adm/harness/Cargo.toml
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/harness
      - name: writer-level cases through the audit toolkit
        run: python docs/audit/adm-remediation/tools/run_remediation.py --repo . --work "$RUNNER_TEMP/adm-remediation" --stage harness --no-dolby --no-ear

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
